name: Minecraft 自动反编译
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      # 1. 修复：移除Maven缓存，仅安装JDK 8（无需缓存，因无Maven项目）
      - name: 配置基础环境
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          # 删掉 cache: maven 这行，避免查找pom.xml

      - run: sudo apt-get update && sudo apt-get install -y unzip wget

      # 2. 新增：检查当前目录结构（可选，用于调试）
      - name: 查看工作目录
        run: ls -la /home/runner/work/server/server/

      # 后续步骤不变，保持原下载、配置、反编译逻辑
      - name: 下载MCP及依赖
        run: |
          wget http://www.modcoderpack.com/files/mcp940.zip -O mcp.zip
          unzip -q mcp.zip -d mcp
          wget http://files.minecraftforge.net/maven/de/oceanlabs/mcp/mcp/1.12.2/mcp-1.12.2-srg.zip -O srg.zip
          unzip -q srg.zip -d mcp/conf
          wget https://github.com/modcoderpack/mcp-mappings-archive/raw/master/mcp_stable/1.12/mcp-1.12-stable.zip -O mappings.zip
          unzip -q mappings.zip -d mcp/conf

      - name: 修改MCP版本配置
        run: |
          cd mcp
          sed -i 's/version=1.12/version=1.12.2/g' conf/version.cfg
          sed -i 's/srg\.version=1.12/srg.version=1.12.2/g' conf/version.cfg

      - name: 下载MC客户端
        run: |
          wget https://launcher.mojang.com/v1/objects/886945bfb2b978778c3a0288fd67b85603676e8/client.jar -O mcp/jars/minecraft.jar

      - name: 运行反编译
        run: |
          cd mcp
          chmod +x decompile.sh
          ./decompile.sh

      - name: 归档输出结果
        uses: actions/upload-artifact@v4
        with:
          name: mc-1.12.2-source
          path: mcp/src/minecraft/
          retention-days: 30
