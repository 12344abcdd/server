name: Minecraft 自动反编译
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: 配置基础环境
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: 下载MCP及依赖（修复映射表链接）
        run: |
          # 下载MCP基础包（断点续传）
          wget -c http://www.modcoderpack.com/files/mcp940.zip -O mcp.zip
          unzip -q -o mcp.zip -d mcp
          
          # 下载SRG映射文件
          wget -c http://files.minecraftforge.net/maven/de/oceanlabs/mcp/mcp/1.12.2/mcp-1.12.2-srg.zip -O srg.zip
          unzip -q -o srg.zip -d mcp/conf
          
          # 修复：替换为1.12.2可用的MCP映射表（Forge官方仓库，稳定有效）
          wget -c https://files.minecraftforge.net/maven/de/oceanlabs/mcp/mcp/1.12.2/mcp-1.12.2.zip -O mappings.zip
          unzip -q -o mappings.zip -d mcp/conf

      - name: 修改MCP版本配置
        run: |
          cd mcp
          sed -i 's/version=1.12/version=1.12.2/g' conf/version.cfg
          sed -i 's/srg\.version=1.12/srg.version=1.12.2/g' conf/version.cfg

      - name: 下载MC客户端（超时重试）
        run: |
          wget -c --timeout=30 --tries=3 https://launcher.mojang.com/v1/objects/886945bfb2b978778c3a0288fd67b85603676e8/client.jar -O mcp/jars/minecraft.jar

      - name: 运行反编译（输出详细日志）
        run: |
          cd mcp
          chmod +x decompile.sh
          ./decompile.sh 2>&1 | tee decompile.log

      - name: 归档反编译日志
        uses: actions/upload-artifact@v4
        with:
          name: decompile-log
          path: mcp/decompile.log
          retention-days: 7

      - name: 归档输出结果
        uses: actions/upload-artifact@v4
        with:
          name: mc-1.12.2-source
          path: mcp/src/minecraft/
          retention-days: 30
