name: Temporary WireGuard VPN Server (Pinggy UDP)
on:
  workflow_dispatch:  # 手动触发工作流

jobs:
  deploy-vpn-server:
    runs-on: ubuntu-latest
    steps:
      - name: Install required dependencies
        run: |
          sudo apt update && sudo apt install -y wireguard jq socat openssh-client
          
      - name: Generate WireGuard key pair and config
        run: |
          # 生成服务端密钥
          sudo mkdir -p /etc/wireguard
          wg genkey | sudo tee /etc/wireguard/server_private.key | wg pubkey | sudo tee /etc/wireguard/server_public.key
          wg genkey | sudo tee /etc/wireguard/client_private.key | wg pubkey | sudo tee /etc/wireguard/client_public.key
          
          # 读取密钥内容
          SERVER_PRIV=$(sudo cat /etc/wireguard/server_private.key)
          SERVER_PUB=$(sudo cat /etc/wireguard/server_public.key)
          CLIENT_PRIV=$(sudo cat /etc/wireguard/client_private.key)
          CLIENT_PUB=$(sudo cat /etc/wireguard/client_public.key)
          
          # 自动识别网卡名称
          DEFAULT_IFACE=$(ip route get 1.1.1.1 | awk '{print $5; exit}')
          
          # 配置服务端 wg0.conf
          sudo tee /etc/wireguard/wg0.conf > /dev/null <<EOF
          [Interface]
          PrivateKey = $SERVER_PRIV
          Address = 10.0.0.1/24
          ListenPort = 1194
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o $DEFAULT_IFACE -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o $DEFAULT_IFACE -j MASQUERADE
          [Peer]
          PublicKey = $CLIENT_PUB
          AllowedIPs = 10.0.0.2/32
          EOF
          
          # 生成客户端配置模板（占位符 PINGGY_ADDR）
          tee client.conf > /dev/null <<EOF
          [Interface]
          PrivateKey = $CLIENT_PRIV
          Address = 10.0.0.2/24
          DNS = 8.8.8.8
          [Peer]
          PublicKey = $SERVER_PUB
          Endpoint = PINGGY_ADDR
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

      - name: Start WireGuard service
        run: |
          sudo wg-quick up wg0
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -p
          sudo wg show wg0

      - name: Expose VPN port via Pinggy free UDP tunnel
        run: |
          # 后台启动 Pinggy UDP 穿透，转发 1194 端口
          nohup ssh -p 443 -R0:localhost:1194 udp@a.pinggy.io > pinggy.log 2>&1 &
          sleep 15  # 等待连接建立
          
          # 从日志提取公网 UDP 地址
          PINGGY_ADDR=$(grep -o 'udp://.*:[0-9]*' pinggy.log | head -n1 | cut -d'/' -f3)
          if [ -z "$PINGGY_ADDR" ]; then
              echo "Error: Pinggy 穿透失败，请重试"
              cat pinggy.log
              exit 1
          fi
          echo "Pinggy Public UDP Address: $PINGGY_ADDR"
          
          # 替换客户端配置占位符
          sed -i "s/PINGGY_ADDR/$PINGGY_ADDR/g" client.conf
          
          # 输出客户端配置
          echo -e "\n===== WireGuard 客户端配置开始 ====="
          cat client.conf
          echo -e "===== WireGuard 客户端配置结束 =====\n"

      - name: Keep workflow running
        run: |
          sleep 35000  # 免费版 GitHub Actions 最长运行 6 小时
