name: Temporary SSH via Cloudflare Tunnel
on:
  workflow_dispatch:  # 手动触发工作流

jobs:
  deploy-ssh-tunnel:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH Server
        run: |
          sudo apt update -y && sudo apt install -y openssh-server jq
          # 创建普通用户，避免root权限限制
          sudo useradd -m sshuser
          echo "sshuser:TempSSH@123456" | sudo chpasswd
          sudo usermod -aG sudo sshuser
          # 开启密码登录
          sudo sed -i -e 's/#PasswordAuthentication yes/PasswordAuthentication yes/' -e 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo service ssh restart

      - name: Install Cloudflared
        run: |
          # 下载并安装 cloudflared
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start Cloudflare Tunnel & Get Temp Domain
        run: |
          # 后台启动隧道，转发SSH 22端口，输出日志到文件
          nohup cloudflared tunnel --url tcp://localhost:22 > tunnel.log 2>&1 &
          sleep 15  # 等待隧道建立连接
          # 提取临时域名（格式：https://xxxx.trycloudflare.com）
          TEMP_DOMAIN=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n1)
          # 输出连接信息
          echo -e "\n===== SSH 连接信息 =====\n"
          echo "临时域名: $TEMP_DOMAIN"
          echo "用户名: sshuser"
          echo "密码: TempSSH@123456"
          echo -e "\nTermux连接命令:\n"
          echo "ssh sshuser@localhost -o ProxyCommand='cloudflared access ssh --hostname $TEMP_DOMAIN'"
          echo -e "\n========================\n"

      - name: Keep Workflow Running
        run: |
          sleep 35000  # 免费版最长运行约6小时
