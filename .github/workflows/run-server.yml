name: Run Server and Commit Configs

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean previous run directory
        run: rm -rf run
        continue-on-error: true

      - name: Initialize server files (generate configs)
        run: |
          echo "Initializing server to generate config files..."
          ./gradlew runserver || true
          echo "Server files generated."

      - name: Accept EULA and configure server
        run: |
          # 移动或复制生成的配置文件到仓库根目录（或你希望的位置）
          # 这里我们将它们复制到一个名为 'server-configs' 的新目录中
          mkdir -p server-configs
          cp run/server/eula.txt server-configs/
          cp run/server/server.properties server-configs/

          # 修改 EULA
          sed -i 's/eula=false/eula=true/' server-configs/eula.txt
          echo "EULA accepted and files copied."

          # 修改 server.properties (例如，设置 online-mode 为 false)
          sed -i.bak 's/online-mode=true/online-mode=false/' server-configs/server.properties
          rm server-configs/server.properties.bak
          echo "Server properties configured."

      - name: Install localtunnel
        run: npm install -g localtunnel

      - name: Start Minecraft Server in Background
        run: |
          echo "Starting Minecraft server with ./gradlew runserver..."
          nohup ./gradlew runserver > server.log 2>&1 &
          echo "Server process started in background."

      - name: Wait for Server to Start
        run: |
          echo "Waiting for Minecraft server to finish initialization..."
          until grep -q "Done" server.log; do
            sleep 5
            echo "Still waiting..."
            tail -n 10 server.log
          done
          echo "Minecraft server has started successfully!"
          tail -n 20 server.log

      - name: Expose Port with localtunnel
        run: |
          echo "Starting localtunnel..."
          nohup lt --port 25565 > lt.log 2>&1 &
          sleep 10
          LT_URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.loca\.lt' lt.log | head -n 1)
          if [ -z "$LT_URL" ]; then
            echo "Error: Failed to retrieve localtunnel URL."
            cat lt.log
            exit 1
          fi
          echo "=================================================="
          echo "Server is accessible at:"
          echo "$LT_URL"
          echo "=================================================="

      - name: Commit and push config files
        run: |
          # 配置 Git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # 检查是否有更改
          git add server-configs/
          git diff --quiet --exit-code --cached || (
            echo "Changes detected. Committing and pushing..."
            git commit -m "Auto-update server configs (eula.txt, server.properties)"
            # 使用 GITHUB_TOKEN 推送
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          )

      - name: Keep Workflow Alive
        run: |
          echo "Workflow is now keeping the server running."
          echo "To stop the server, please cancel this workflow run."
          trap 'echo "Cleaning up..."; pkill -f gradle; pkill -f lt; exit 0' SIGINT SIGTERM
          while true; do sleep 3600; done

      - name: Post-Cleanup
        if: always()
        run: |
          echo "Post-run cleanup..."
          pkill -f gradle
          pkill -f lt
          echo "Post-run cleanup complete."
